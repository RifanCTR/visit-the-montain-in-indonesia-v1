<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Mountain Indonesia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      padding: 0; 
      margin: 0; 
      box-sizing: border-box; 
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      width: 100%;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-right, .nav-left { 
      display: flex; 
      gap: 15px; 
    }

    .nav-left a, .nav-right a { 
      font-size: 13px; 
      text-decoration: none; 
      color: #a3a3a3; 
      font-family: cursive; 
      font-weight: 600; 
      transition: color 0.3s ease; 
    }

    .nav-left a:hover, .nav-right a:hover { 
      color: #ffffff; 
    }

    #text-logo { 
      color: #fff; 
      font-size: 16px; 
      letter-spacing: 3px; 
      text-align: center; 
      font-family: cursive; 
    }

    .main-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }

    .login-container {
      width: 90%;
      max-width: 440px;
      margin: 10px auto;
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .login-header-icon {
      font-size: 28px;
      color: #fff;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .status-badge.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-badge.inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .login-form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .login-form-group label {
      display: block;
      font-size: 11.5px;
      color: #d1d5db;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .password-input-wrapper {
      position: relative;
    }

    .login-form-group input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-form-group input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle-password-btn:hover {
      color: #fff;
    }

    .btn-submit-login {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #111;
      border: none;
      font-weight: bold;
      font-size: 12.5px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit-login:hover {
      background: #e5e5e5;
    }

    .btn-logout {
      width: 100%;
      padding: 12px;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-weight: bold;
      font-size: 12.5px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ff6b6b;
    }

    .btn-back-home {
      display: inline-block;
      color: #9ca3af;
      font-size: 11.5px;
      text-decoration: none;
      margin-top: 14px;
      transition: color 0.2s;
    }

    .btn-back-home:hover {
      color: #fff;
    }

    /* Styles Terminal Admin */
    .terminal-container {
      width: 90%;
      max-width: 700px;
      margin: 20px auto 10px auto;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      font-family: 'Consolas', 'Courier New', monospace;
      text-align: left;
    }

    .terminal-header {
      background: #1e293b;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .terminal-title {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .terminal-controls {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.red { background: #ef4444; }
    .dot.yellow { background: #f59e0b; }
    .dot.green { background: #10b981; }

    .terminal-body {
      padding: 14px;
      height: 270px;
      overflow-y: auto;
      font-size: 11.5px;
      line-height: 1.6;
      color: #38bdf8;
    }

    .terminal-body::-webkit-scrollbar {
      width: 6px;
    }

    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .log-line {
      margin-bottom: 4px;
      word-break: break-all;
    }

    .log-time { color: #64748b; }
    .log-tag-info { color: #38bdf8; font-weight: bold; }
    .log-tag-success { color: #4ade80; font-weight: bold; }
    .log-tag-device { color: #facc15; font-weight: bold; }
    .log-tag-matrix { color: #22c55e; font-family: monospace; }

    .terminal-input-line {
      display: flex;
      align-items: center;
      background: #090d16;
      padding: 8px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .terminal-prompt {
      color: #4ade80;
      font-size: 11.5px;
      margin-right: 8px;
      font-weight: bold;
    }

    .terminal-input {
      flex: 1;
      background: none;
      border: none;
      color: #f8fafc;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11.5px;
      outline: none;
    }

    #kaki { 
      width: 100%;
      color: #737373; 
      text-align: center; 
      background-color: #0d0d0d; 
      padding: 20px; 
      font-size: 12px; 
      border-top: 1px solid rgba(255,255,255,0.05); 
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </div>
    <div class="logo">
      <h1 id="text-logo">Mountain</h1>
    </div>
    <div class="nav-right">
      <a href="service.html">Service</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="main-wrapper">
    <div class="login-container">
      <div class="login-header-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h2 style="font-size: 16px; margin-bottom: 8px; color: #fff;">Autentikasi Admin</h2>
      
      <div id="status-badge-box"></div>

      <div id="login-form-area">
        <div class="login-form-group">
          <label for="input-username">Username</label>
          <input type="text" id="input-username" placeholder="Masukkan username...">
        </div>

        <div class="login-form-group">
          <label for="input-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="input-password" placeholder="Masukkan password...">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
          </div>
        </div>

        <button type="button" class="btn-submit-login" onclick="processAdminLogin()">Verifikasi</button>
      </div>

      <div id="logged-in-area" style="display: none;">
        <p style="font-size: 12px; color: #9ca3af; margin-bottom: 14px; line-height: 1.5;">
          Kamu memiliki akses penuh ke fitur pengelola komentar & admin console.
        </p>
        <button type="button" class="btn-submit-login" style="margin-bottom: 8px;" onclick="goToAdminPanel()">Ke Panel Komentar Admin</button>
        <button type="button" class="btn-logout" onclick="processAdminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout Sesi Admin</button>
      </div>

      <a href="index.html" class="btn-back-home">Kembali ke Beranda</a>
    </div>

    <!-- Terminal Box Super Lengkap -->
    <div class="terminal-container" id="admin-terminal" style="display: none;">
      <div class="terminal-header">
        <div class="terminal-title">
          <i class="fa-solid fa-terminal" style="color: #38bdf8;"></i> Admin Terminal & Advanced Logs v2.5
        </div>
        <div class="terminal-controls">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
      </div>
      
      <div class="terminal-body" id="terminal-logs">
        <!-- Log System & Visitor bakal ter-render di sini -->
      </div>

      <div class="terminal-input-line">
        <span class="terminal-prompt">admin@mountain-v1:~$</span>
        <input type="text" class="terminal-input" id="terminal-cmd" placeholder="Ketik 'help' untuk daftar perintah..." onkeydown="handleTerminalCommand(event)">
      </div>
    </div>
  </div>

  <footer id="kaki">&copy; 2026 Mountain. All rights reserved.</footer>

  <script>
    function checkAdminStatus() {
      const isAdmin = localStorage.getItem('is_admin') === 'true';
      const statusBadgeBox = document.getElementById('status-badge-box');
      const loginFormArea = document.getElementById('login-form-area');
      const loggedInArea = document.getElementById('logged-in-area');
      const adminTerminal = document.getElementById('admin-terminal');

      if (isAdmin) {
        statusBadgeBox.innerHTML = `<div class="status-badge active"><i class="fa-solid fa-circle-check"></i> Status: Admin Aktif (Sesi Terhubung)</div>`;
        loginFormArea.style.display = 'none';
        loggedInArea.style.display = 'block';
        adminTerminal.style.display = 'block';
        initTerminalLogs();
      } else {
        statusBadgeBox.innerHTML = `<div class="status-badge inactive"><i class="fa-solid fa-circle-xmark"></i> Status: Belum Login</div>`;
        loginFormArea.style.display = 'block';
        loggedInArea.style.display = 'none';
        adminTerminal.style.display = 'none';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function processAdminLogin() {
      const user = document.getElementById('input-username').value.trim();
      const pass = document.getElementById('input-password').value.trim();

      const encodedUser = btoa(user);
      const encodedPass = btoa(pass);

      const targetUser = 'cmlmZGVycHJpbW8=';
      const targetPass = 'YmxhY2tjaXBoZXI=';

      if (encodedUser === targetUser && encodedPass === targetPass) {
        localStorage.setItem('is_admin', 'true');
        recordVisitorLog('ADMIN_LOGIN', 'Admin login berhasil via /login.html');
        alert('Autentikasi Berhasil! Kamu sekarang aktif sebagai Admin.');
        checkAdminStatus();
      } else {
        alert('Username atau Password salah!');
      }
    }

    function processAdminLogout() {
      if (confirm('Yakin mau keluar dari sesi admin?')) {
        localStorage.setItem('is_admin', 'false');
        alert('Berhasil Logout!');
        checkAdminStatus();
      }
    }

    function goToAdminPanel() {
      window.location.replace('index.html#contact');
    }

    // --- FITUR LOGS & TERMINAL SYSTEM LANJUTAN ---

    function getDeviceDetails() {
      const ua = navigator.userAgent;
      let deviceType = "Desktop";
      if (/Mobi|Android|iPhone|iPad/i.test(ua)) {
        deviceType = "Mobile / Tablet";
      }

      let browserName = "Browser";
      if (ua.includes("Chrome")) browserName = "Chrome";
      else if (ua.includes("Safari")) browserName = "Safari";
      else if (ua.includes("Firefox")) browserName = "Firefox";
      else if (ua.includes("Edg")) browserName = "Edge";

      return `${deviceType} (${browserName})`;
    }

    function recordVisitorLog(type, details) {
      const logs = JSON.parse(localStorage.getItem('mountain_visitor_logs') || '[]');
      const now = new Date();
      const timeStr = now.toLocaleDateString('id-ID', {
        day: '2-digit', month: 'long', year: 'numeric'
      }) + ' - ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const newLog = {
        time: timeStr,
        type: type,
        device: getDeviceDetails(),
        details: details
      };

      logs.unshift(newLog);
      if (logs.length > 40) logs.pop();
      localStorage.setItem('mountain_visitor_logs', JSON.stringify(logs));
    }

    function initTerminalLogs() {
      const logsContainer = document.getElementById('terminal-logs');
      const now = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
      
      let html = `
        <div class="log-line"><span class="log-time">[SYSTEM]</span> Mountain Security Console v2.5 initialized.</div>
        <div class="log-line"><span class="log-tag-success">[OK]</span> Vercel Cloud Node Connected (${now})</div>
        <div class="log-line"><span class="log-tag-info">[INFO]</span> Authenticated as: Master Admin [rifderprimo]</div>
        <div class="log-line" style="margin-bottom: 10px;"><span class="log-tag-device">[DEVICE]</span> ${getDeviceDetails()} | Res: ${window.innerWidth}x${window.innerHeight}</div>
        <div class="log-line" style="color: #e2e8f0; font-weight: bold; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 6px;">--- DAFTAR RIWAYAT KUNJUNGAN & AKTIVITAS ---</div>
      `;

      const savedLogs = JSON.parse(localStorage.getItem('mountain_visitor_logs') || '[]');

      if (savedLogs.length === 0) {
        html += `<div class="log-line" style="color: #94a3b8;">Belum ada riwayat log tercatat.</div>`;
      } else {
        savedLogs.forEach((log) => {
          html += `
            <div class="log-line">
              <span class="log-time">[${log.time}]</span> 
              <span class="${log.type === 'ADMIN_LOGIN' ? 'log-tag-success' : 'log-tag-info'}">[${log.type}]</span> 
              <span class="log-tag-device">${log.device}</span> - ${log.details}
            </div>
          `;
        });
      }

      logsContainer.innerHTML = html;
      logsContainer.scrollTop = 0;
    }

    function handleTerminalCommand(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('terminal-cmd');
        const cmd = input.value.trim().toLowerCase();
        const logsContainer = document.getElementById('terminal-logs');

        if (!cmd) return;

        // Simpan ke riwayat perintah terminal lokal
        let cmdHistory = JSON.parse(localStorage.getItem('terminal_cmd_history') || '[]');
        cmdHistory.push(cmd);
        localStorage.setItem('terminal_cmd_history', JSON.stringify(cmdHistory));

        let responseText = '';

        if (cmd === 'help') {
          responseText = `
            <div><b>Daftar Perintah Terminal Admin:</b></div>
            <div>- <b>status</b>    : Cek status koneksi Vercel & server</div>
            <div>- <b>visitors</b>  : Tampilkan semua riwayat log kunjungan</div>
            <div>- <b>sysinfo</b>   : Tampilkan detail perangkat & browser lu</div>
            <div>- <b>ping</b>      : Tes latensi koneksi jaringan</div>
            <div>- <b>matrix</b>    : Jalankan simulasi matriks hacker</div>
            <div>- <b>history</b>   : Lihat riwayat perintah yang pernah diketik</div>
            <div>- <b>clearlog</b>  : Hapus seluruh riwayat log aktivitas</div>
            <div>- <b>clear</b>     : Bersihkan layar terminal</div>
            <div>- <b>logout</b>    : Keluar dari sesi admin</div>
          `;
        } else if (cmd === 'status') {
          responseText = `<span class="log-tag-success">[ONLINE]</span> Vercel deployment running securely. All modules active.`;
        } else if (cmd === 'visitors') {
          const logs = JSON.parse(localStorage.getItem('mountain_visitor_logs') || '[]');
          responseText = `<span class="log-tag-info">[LOG STATS]</span> Total ${logs.length} catatan aktivitas tersimpan di database lokal browser.`;
        } else if (cmd === 'sysinfo') {
          responseText = `
            <div>- Platform: ${navigator.platform}</div>
            <div>- Language: ${navigator.language}</div>
            <div>- Resolution: ${window.innerWidth} x ${window.innerHeight} pixels</div>
            <div>- User Agent: ${navigator.userAgent}</div>
          `;
        } else if (cmd === 'ping') {
          responseText = `<span class="log-tag-success">[PONG]</span> Response time: 18ms. Server Vercel stable.`;
        } else if (cmd === 'matrix') {
          responseText = `<span class="log-tag-matrix">01010011 01011001 01010011 01010100 01000101 01001101 00100000 01000011 01010011 01010011</span> (Matrix Stream Active...)`;
        } else if (cmd === 'history') {
          const history = JSON.parse(localStorage.getItem('terminal_cmd_history') || '[]');
          responseText = `<div>Riwayat perintah: ${history.join(', ')}</div>`;
        } else if (cmd === 'clearlog') {
          localStorage.removeItem('mountain_visitor_logs');
          responseText = `<span class="log-tag-success">[SUCCESS]</span> Seluruh riwayat log berhasil dibersihkan!`;
          setTimeout(initTerminalLogs, 500);
        } else if (cmd === 'clear') {
          logsContainer.innerHTML = '';
          input.value = '';
          return;
        } else if (cmd === 'logout') {
          processAdminLogout();
          input.value = '';
          return;
        } else {
          responseText = `<span style="color: #ef4444;">Perintah '${cmd}' tidak dikenali. Ketik 'help' untuk daftar perintah.</span>`;
        }

        logsContainer.innerHTML += `
          <div class="log-line" style="margin-top: 8px;">
            <span class="terminal-prompt">admin@mountain-v1:~$</span> ${cmd}
          </div>
          <div class="log-line">${responseText}</div>
        `;

        input.value = '';
        logsContainer.scrollTop = logsContainer.scrollHeight;
      }
    }

    // Perekaman otomatis kunjungan
    window.addEventListener('DOMContentLoaded', () => {
      checkAdminStatus();
      recordVisitorLog('VISIT', 'Halaman login.html dibuka');
    });
  </script>
</body>
</html>

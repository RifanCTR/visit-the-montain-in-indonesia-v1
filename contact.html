<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact - Mountain Indonesia</title>
  <style>
    * { 
      padding: 0; 
      margin: 0; 
      box-sizing: border-box; 
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      overflow-y: scroll;
      background-color: #0d0d0d;
      color: #fff;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0px !important;
      height: 0px !important;
      display: none !important;
    }

    /* Navbar Full Blur Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .nav-right, .nav-left { 
      display: flex; 
      gap: 15px; 
      z-index: 2; 
    }

    .nav-left a, .nav-right a { 
      font-size: 13px; 
      text-decoration: none; 
      color: #a3a3a3; 
      font-family: cursive; 
      font-weight: 600; 
      transition: color 0.3s ease; 
    }

    .nav-left a:hover, .nav-right a:hover { 
      color: #ffffff; 
    }

    #text-logo { 
      color: #fff; 
      font-size: 16px; 
      letter-spacing: 3px; 
      text-align: center; 
      font-family: cursive; 
    }

    .contact-container {
      width: 92%; 
      max-width: 500px; 
      margin: 35px auto; 
      padding: 24px;
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .contact-container h1 { 
      font-size: 20px; 
      color: #ffffff; 
      margin-bottom: 8px; 
      text-align: center; 
    }

    .contact-desc {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    #tombol-kirim-tele {
      display: block;
      width: 100%;
      height: 44px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background-color: #ffffff;
      color: #111;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #tombol-kirim-tele:hover {
      background-color: #e5e5e5;
      transform: translateY(-1px);
    }

    #status-msg {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }

    /* Footer */
    #kaki { 
      color: #737373; 
      text-align: center; 
      background-color: #0d0d0d; 
      padding: 20px; 
      font-size: 12px; 
      border-top: 1px solid rgba(255,255,255,0.05); 
      margin-top: 40px; 
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </div>
    <div class="logo">
      <h1 id="text-logo">Mountain</h1>
    </div>
    <div class="nav-right">
      <a href="service.html">Service</a>
      <a href="contact.html" style="color: #ffffff;">Contact</a>
    </div>
  </nav>

  <div class="contact-container">
    <h1>Hubungi Kami</h1>
    <p class="contact-desc">Kirimkan kritik, saran, atau pesan Anda langsung ke grup komunikasi tim kami.</p>
    
    <form id="contact-form">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" class="form-input" placeholder="Masukkan nama lengkap..." required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Masukkan email..." required>
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" class="form-textarea" placeholder="Tulis pesan atau saran..." required></textarea>
      </div>

      <button type="submit" id="tombol-kirim-tele">Kirim Pesan</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <footer id="kaki">&copy; 2026 Mountain. All rights reserved.</footer>

  <script>
    const form = document.getElementById('contact-form');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const nama = document.getElementById('nama').value.trim();
      const email = document.getElementById('email').value.trim();
      const pesan = document.getElementById('pesan').value.trim();
      const btn = document.getElementById('tombol-kirim-tele');

      if (!nama || !email || !pesan) return;

      btn.disabled = true;
      btn.textContent = "Mengirim...";
      statusMsg.style.color = "#9ca3af";
      statusMsg.textContent = "Mengirim pesan...";

      try {
        const response = await fetch('/api/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, email, pesan })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          statusMsg.style.color = "#ffffff";
          statusMsg.textContent = "Pesan berhasil terkirim!";
          form.reset();
        } else {
          throw new Error(data.error || "Gagal mengirim.");
        }
      } catch (error) {
        statusMsg.style.color = "#ef4444";
        statusMsg.textContent = "Gagal mengirim pesan.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Kirim Pesan";
      }
    });
  </script>
</body>
</html>

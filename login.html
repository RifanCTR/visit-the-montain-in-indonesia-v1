<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Mountain Indonesia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    html, body { width: 100%; min-height: 100vh; background-color: #0d0d0d; color: #fff; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 5%; width: 100%; background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .nav-right, .nav-left { display: flex; gap: 15px; }
    .nav-left a, .nav-right a { font-size: 13px; text-decoration: none; color: #a3a3a3; font-family: cursive; font-weight: 600; }
    .nav-left a:hover, .nav-right a:hover { color: #ffffff; }
    #text-logo { color: #fff; font-size: 16px; letter-spacing: 3px; text-align: center; font-family: cursive; }
    .main-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .login-container { width: 90%; max-width: 440px; margin: 10px auto; background: rgba(18, 18, 18, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); padding: 28px; border-radius: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; }
    .login-header-icon { font-size: 28px; color: #fff; margin-bottom: 10px; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 11.5px; font-weight: bold; margin-bottom: 16px; }
    .status-badge.active { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-badge.inactive { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .login-form-group { margin-bottom: 16px; text-align: left; }
    .login-form-group label { display: block; font-size: 11.5px; color: #d1d5db; margin-bottom: 6px; font-weight: 600; }
    .password-input-wrapper { position: relative; }
    .login-form-group input { width: 100%; padding: 11px 14px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: #fff; font-size: 12.5px; outline: none; }
    .toggle-password-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 14px; }
    .btn-submit-login { width: 100%; padding: 12px; background: #ffffff; color: #111; border: none; font-weight: bold; font-size: 12.5px; border-radius: 10px; cursor: pointer; margin-top: 8px; }
    .btn-logout { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); font-weight: bold; font-size: 12.5px; border-radius: 10px; cursor: pointer; margin-top: 8px; }
    .btn-back-home { display: inline-block; color: #9ca3af; font-size: 11.5px; text-decoration: none; margin-top: 14px; }
    .terminal-container { width: 90%; max-width: 700px; margin: 20px auto 10px auto; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); overflow: hidden; font-family: 'Consolas', 'Courier New', monospace; text-align: left; }
    .terminal-header { background: #1e293b; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .terminal-title { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
    .terminal-controls { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.red { background: #ef4444; } .dot.yellow { background: #f59e0b; } .dot.green { background: #10b981; }
    .terminal-body { padding: 14px; height: 280px; overflow-y: auto; font-size: 11.5px; line-height: 1.6; color: #38bdf8; }
    .log-line { margin-bottom: 4px; word-break: break-all; }
    .log-time { color: #64748b; }
    .log-tag-info { color: #38bdf8; font-weight: bold; }
    .log-tag-success { color: #4ade80; font-weight: bold; }
    .msg-box { border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; margin: 6px 0; color: #e2e8f0; }
    .terminal-input-line { display: flex; align-items: center; background: #090d16; padding: 8px 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .terminal-prompt { color: #4ade80; font-size: 11.5px; margin-right: 8px; font-weight: bold; }
    .terminal-input { flex: 1; background: none; border: none; color: #f8fafc; font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; outline: none; }
    #kaki { width: 100%; color: #737373; text-align: center; background-color: #0d0d0d; padding: 20px; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </div>
    <div class="logo">
      <h1 id="text-logo">Mountain</h1>
    </div>
    <div class="nav-right">
      <a href="service.html">Service</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="main-wrapper">
    <div class="login-container">
      <div class="login-header-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h2 style="font-size: 16px; margin-bottom: 8px; color: #fff;">Autentikasi Admin</h2>
      <div id="status-badge-box"></div>

      <div id="login-form-area">
        <div class="login-form-group">
          <label for="input-username">Username</label>
          <input type="text" id="input-username" placeholder="Masukkan username...">
        </div>
        <div class="login-form-group">
          <label for="input-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="input-password" placeholder="Masukkan password...">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
          </div>
        </div>
        <button type="button" class="btn-submit-login" onclick="processAdminLogin()">Verifikasi</button>
      </div>

      <div id="logged-in-area" style="display: none;">
        <p style="font-size: 12px; color: #9ca3af; margin-bottom: 14px; line-height: 1.5;">Kamu memiliki akses penuh ke fitur pengelola database & admin console.</p>
        <button type="button" class="btn-submit-login" style="margin-bottom: 8px;" onclick="goToAdminPanel()">Ke Panel Komentar Admin</button>
        <button type="button" class="btn-logout" onclick="processAdminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout Sesi Admin</button>
      </div>
      <a href="index.html" class="btn-back-home">Kembali ke Beranda</a>
    </div>

    <div class="terminal-container" id="admin-terminal" style="display: none;">
      <div class="terminal-header">
        <div class="terminal-title"><i class="fa-solid fa-terminal" style="color: #38bdf8;"></i> Supabase Database Terminal v3.5</div>
        <div class="terminal-controls"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      </div>
      <div class="terminal-body" id="terminal-logs"></div>
      <div class="terminal-input-line">
        <span class="terminal-prompt">admin@mountain-v1:~$</span>
        <input type="text" class="terminal-input" id="terminal-cmd" placeholder="Ketik 'help' untuk daftar perintah..." onkeydown="handleTerminalCommand(event)">
      </div>
    </div>
  </div>

  <footer id="kaki">&copy; 2026 Mountain. All rights reserved.</footer>

  <script>
    // Konfigurasi Supabase yang sudah terhubung
    const SUPABASE_URL = 'https://tobxthiynwepeylbblsv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_icluCCVkHxsP8K2RfjE_4A_tCTX0B-F';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function checkAdminStatus() {
      const isAdmin = localStorage.getItem('is_admin') === 'true';
      const statusBadgeBox = document.getElementById('status-badge-box');
      const loginFormArea = document.getElementById('login-form-area');
      const loggedInArea = document.getElementById('logged-in-area');
      const adminTerminal = document.getElementById('admin-terminal');

      if (isAdmin) {
        statusBadgeBox.innerHTML = `<div class="status-badge active"><i class="fa-solid fa-circle-check"></i> Status: Admin Aktif</div>`;
        loginFormArea.style.display = 'none';
        loggedInArea.style.display = 'block';
        adminTerminal.style.display = 'block';
        initTerminalLogs();
      } else {
        statusBadgeBox.innerHTML = `<div class="status-badge inactive"><i class="fa-solid fa-circle-xmark"></i> Status: Belum Login</div>`;
        loginFormArea.style.display = 'block';
        loggedInArea.style.display = 'none';
        adminTerminal.style.display = 'none';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye';
      }
    }

    function processAdminLogin() {
      const user = document.getElementById('input-username').value.trim();
      const pass = document.getElementById('input-password').value.trim();

      if (btoa(user) === 'cmlmZGVycHJpbW8=' && btoa(pass) === 'YmxhY2tjaXBoZXI=') {
        localStorage.setItem('is_admin', 'true');
        alert('Autentikasi Berhasil! Kamu sekarang aktif sebagai Admin.');
        checkAdminStatus();
      } else {
        alert('Username atau Password salah!');
      }
    }

    function processAdminLogout() {
      if (confirm('Yakin mau keluar dari sesi admin?')) {
        localStorage.setItem('is_admin', 'false');
        alert('Berhasil Logout!');
        checkAdminStatus();
      }
    }

    function goToAdminPanel() { window.location.replace('index.html#contact'); }

    async function initTerminalLogs() {
      const logsContainer = document.getElementById('terminal-logs');
      
      logsContainer.innerHTML = `
        <div class="log-line"><span class="log-time">[SYSTEM]</span> Supabase Cloud Connected.</div>
        <div class="log-line"><span class="log-tag-success">[OK]</span> Admin Session Active [rifderprimo]</div>
        <div class="log-line" style="color: #e2e8f0; font-weight: bold; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 6px; margin-top: 6px;">--- KETIK 'messages' UNTUK MEMBACA DATABASE ---</div>
      `;
      logsContainer.scrollTop = 0;
    }

    async function handleTerminalCommand(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('terminal-cmd');
        const rawCmd = input.value.trim();
        if (!rawCmd) return;

        const cmdParts = rawCmd.split(' ');
        const mainCmd = cmdParts[0].toLowerCase();
        const param = cmdParts[1];
        const logsContainer = document.getElementById('terminal-logs');

        let responseText = '';

        if (mainCmd === 'help') {
          responseText = `
            <div><b>Daftar Perintah Terminal Database:</b></div>
            <div>- <b>messages</b> (atau <b>inbox</b>) : Ambil & baca pesan langsung dari Supabase</div>
            <div>- <b>delmsg &lt;id&gt;</b>           : Hapus pesan dari database berdasarkan ID angka</div>
            <div>- <b>clearinbox</b>            : Bersihkan cache pesan lokal</div>
            <div>- <b>status</b>                : Cek koneksi cloud Supabase</div>
            <div>- <b>clear</b>                 : Bersihkan layar terminal</div>
            <div>- <b>logout</b>                : Logout admin</div>
          `;
        } else if (mainCmd === 'messages' || mainCmd === 'inbox') {
          logsContainer.innerHTML += `<div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">admin@mountain-v1:~$</span> ${rawCmd}</div>`;
          logsContainer.innerHTML += `<div class="log-line" style="color: #facc15;">Mengambil data dari Supabase...</div>`;
          
          const { data: messages, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) {
            responseText = `<span style="color: #ef4444;">Gagal mengambil data: ${error.message}</span>`;
          } else if (!messages || messages.length === 0) {
            responseText = `<div class="log-line" style="color: #94a3b8;">Database kosong (Belum ada pesan masuk).</div>`;
          } else {
            responseText = `<div style="color: #4ade80; font-weight: bold; margin-bottom: 6px;">--- PESAN MASUK DI SUPABASE (${messages.length}) ---</div>`;
            messages.forEach((msg) => {
              const dateFormatted = new Date(msg.created_at).toLocaleString('id-ID');
              responseText += `
                <div class="msg-box">
                  <div><span style="color: #facc15;">ID Database: ${msg.id}</span> | <span style="color: #94a3b8;">${dateFormatted}</span></div>
                  <div><b>Pengirim:</b> ${msg.nama} (${msg.email})</div>
                  <div style="margin-top: 4px; color: #38bdf8;"><b>Pesan:</b> "${msg.pesan}"</div>
                </div>
              `;
            });
          }
        } else if (mainCmd === 'delmsg') {
          if (!param) {
            responseText = `<span style="color: #ef4444;">Harap masukkan ID pesan! Contoh: <b>delmsg 5</b></span>`;
          } else {
            logsContainer.innerHTML += `<div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">admin@mountain-v1:~$</span> ${rawCmd}</div>`;
            logsContainer.innerHTML += `<div class="log-line" style="color: #facc15;">Menghapus ID ${param} dari Supabase & penyimpanan lokal...</div>`;

            // 1. Hapus dari database Supabase
            const { error } = await supabaseClient
              .from('messages')
              .delete()
              .eq('id', param);

            // 2. Hapus juga dari cadangan localStorage (jika ada)
            let localInbox = JSON.parse(localStorage.getItem('mountain_private_inbox') || '[]');
            localInbox = localInbox.filter(m => m.id !== param);
            localStorage.setItem('mountain_private_inbox', JSON.stringify(localInbox));

            if (error) {
              responseText = `<span style="color: #ef4444;">Gagal menghapus dari database: ${error.message}</span>`;
            } else {
              responseText = `<span class="log-tag-success">[BERHASIL]</span> Pesan ID <b>${param}</b> berhasil dihapus bersih dari Database Supabase & Local Storage!`;
            }
          }
        } else if (mainCmd === 'clearinbox') {
          localStorage.removeItem('mountain_private_inbox');
          responseText = `<span class="log-tag-success">[SUCCESS]</span> Seluruh cache pesan lokal berhasil dibersihkan!`;
        } else if (mainCmd === 'status') {
          responseText = `<span class="log-tag-success">[ONLINE]</span> Supabase database connected and synchronized.`;
        } else if (mainCmd === 'clear') {
          logsContainer.innerHTML = '';
          input.value = '';
          return;
        } else if (mainCmd === 'logout') {
          processAdminLogout();
          input.value = '';
          return;
        } else {
          responseText = `<span style="color: #ef4444;">Perintah '${rawCmd}' tidak dikenali. Ketik 'help' untuk bantuan.</span>`;
        }

        if (mainCmd !== 'messages' && mainCmd !== 'inbox' && mainCmd !== 'delmsg') {
          logsContainer.innerHTML += `
            <div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">admin@mountain-v1:~$</span> ${rawCmd}</div>
          `;
        }
        
        logsContainer.innerHTML += `<div class="log-line">${responseText}</div>`;
        input.value = '';
        logsContainer.scrollTop = logsContainer.scrollHeight;
      }
    }

    window.addEventListener('DOMContentLoaded', checkAdminStatus);
  </script>
</body>
</html>

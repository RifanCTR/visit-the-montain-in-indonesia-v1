<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Mountain Indonesia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      padding: 0; 
      margin: 0; 
      box-sizing: border-box; 
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
    }

    html, body {
      width: 100%;
      height: 100vh;
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      width: 100%;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-right, .nav-left { 
      display: flex; 
      gap: 15px; 
    }

    .nav-left a, .nav-right a { 
      font-size: 13px; 
      text-decoration: none; 
      color: #a3a3a3; 
      font-family: cursive; 
      font-weight: 600; 
      transition: color 0.3s ease; 
    }

    .nav-left a:hover, .nav-right a:hover { 
      color: #ffffff; 
    }

    #text-logo { 
      color: #fff; 
      font-size: 16px; 
      letter-spacing: 3px; 
      text-align: center; 
      font-family: cursive; 
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      margin: auto;
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .login-header-icon {
      font-size: 28px;
      color: #fff;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .status-badge.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-badge.inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .login-form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .login-form-group label {
      display: block;
      font-size: 11.5px;
      color: #d1d5db;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .password-input-wrapper {
      position: relative;
    }

    .login-form-group input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-form-group input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle-password-btn:hover {
      color: #fff;
    }

    .btn-submit-login {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #111;
      border: none;
      font-weight: bold;
      font-size: 12.5px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit-login:hover {
      background: #e5e5e5;
    }

    .btn-logout {
      width: 100%;
      padding: 12px;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
      font-weight: bold;
      font-size: 12.5px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ff6b6b;
    }

    .btn-back-home {
      display: inline-block;
      color: #9ca3af;
      font-size: 11.5px;
      text-decoration: none;
      margin-top: 14px;
      transition: color 0.2s;
    }

    .btn-back-home:hover {
      color: #fff;
    }

    #kaki { 
      width: 100%;
      color: #737373; 
      text-align: center; 
      background-color: #0d0d0d; 
      padding: 20px; 
      font-size: 12px; 
      border-top: 1px solid rgba(255,255,255,0.05); 
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </div>
    <div class="logo">
      <h1 id="text-logo">Mountain</h1>
    </div>
    <div class="nav-right">
      <a href="service.html">Service</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-header-icon"><i class="fa-solid fa-user-shield"></i></div>
    <h2 style="font-size: 16px; margin-bottom: 8px; color: #fff;">Autentikasi Admin</h2>
    
    <div id="status-badge-box"></div>

    <div id="login-form-area">
      <div class="login-form-group">
        <label for="input-username">Username</label>
        <input type="text" id="input-username" placeholder="Masukkan username...">
      </div>

      <div class="login-form-group">
        <label for="input-password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="input-password" placeholder="Masukkan password...">
          <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
        </div>
      </div>

      <button type="button" class="btn-submit-login" onclick="processAdminLogin()">Verifikasi & Login</button>
    </div>

    <div id="logged-in-area" style="display: none;">
      <p style="font-size: 12px; color: #9ca3af; margin-bottom: 14px; line-height: 1.5;">
        Kamu memiliki akses penuh ke fitur pengelola komentar & admin.
      </p>
      <button type="button" class="btn-submit-login" style="margin-bottom: 8px;" onclick="goToAdminPanel()">Ke Panel Komentar Admin</button>
      <button type="button" class="btn-logout" onclick="processAdminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout Sesi Admin</button>
    </div>

    <a href="index.html" class="btn-back-home">Kembali ke Beranda</a>
  </div>

  <footer id="kaki">&copy; 2026 Mountain. All rights reserved.</footer>

  <script>
    function checkAdminStatus() {
      const isAdmin = localStorage.getItem('is_admin') === 'true';
      const statusBadgeBox = document.getElementById('status-badge-box');
      const loginFormArea = document.getElementById('login-form-area');
      const loggedInArea = document.getElementById('logged-in-area');

      if (isAdmin) {
        statusBadgeBox.innerHTML = `<div class="status-badge active"><i class="fa-solid fa-circle-check"></i> Status: Admin Aktif (Sesi Terhubung)</div>`;
        loginFormArea.style.display = 'none';
        loggedInArea.style.display = 'block';
      } else {
        statusBadgeBox.innerHTML = `<div class="status-badge inactive"><i class="fa-solid fa-circle-xmark"></i> Status: Belum Login</div>`;
        loginFormArea.style.display = 'block';
        loggedInArea.style.display = 'none';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function processAdminLogin() {
      const user = document.getElementById('input-username').value.trim();
      const pass = document.getElementById('input-password').value.trim();

      const encodedUser = btoa(user);
      const encodedPass = btoa(pass);

      const targetUser = 'cmlmZGVycHJpbW8=';
      const targetPass = 'YmxhY2tjaXBoZXI=';

      if (encodedUser === targetUser && encodedPass === targetPass) {
        localStorage.setItem('is_admin', 'true');
        alert('Autentikasi Berhasil! Kamu sekarang aktif sebagai Admin.');
        checkAdminStatus();
      } else {
        alert('Username atau Password salah!');
      }
    }

    function processAdminLogout() {
      if (confirm('Yakin mau keluar dari sesi admin?')) {
        localStorage.setItem('is_admin', 'false');
        alert('Berhasil Logout!');
        checkAdminStatus();
      }
    }

    function goToAdminPanel() {
      window.location.replace('index.html#contact');
    }

    window.addEventListener('DOMContentLoaded', checkAdminStatus);
  </script>
</body>
</html>

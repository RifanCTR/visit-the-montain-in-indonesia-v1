<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secure Core Terminal - Mountain OS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', monospace; }
    html, body { width: 100%; min-height: 100vh; background-color: #030712; color: #fff; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 0; }
    
    .main-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
    
    .login-container { width: 90%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(56, 189, 248, 0.3); padding: 28px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
    .login-header-icon { font-size: 32px; color: #38bdf8; margin-bottom: 12px; }
    
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 11.5px; font-weight: bold; margin-bottom: 16px; }
    .status-badge.active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-badge.inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    
    .login-form-group { margin-bottom: 16px; text-align: left; }
    .login-form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: bold; }
    .password-input-wrapper { position: relative; }
    .login-form-group input { width: 100%; padding: 11px 14px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; color: #fff; font-size: 12.5px; outline: none; font-family: 'Consolas', monospace; }
    .toggle-password-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 14px; }
    
    .btn-submit-login { width: 100%; padding: 12px; background: #38bdf8; color: #030712; border: none; font-weight: bold; font-size: 12.5px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-family: 'Consolas', monospace; }
    .btn-submit-login:hover { background: #0ea5e9; }
    
    .btn-logout { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); font-weight: bold; font-size: 12.5px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-family: 'Consolas', monospace; }
    .btn-back-home { display: inline-block; color: #64748b; font-size: 11px; text-decoration: none; margin-top: 16px; }
    .btn-back-home:hover { color: #38bdf8; }

    .terminal-container { width: 90%; max-width: 750px; margin: 20px auto 0 auto; background: #030712; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); overflow: hidden; text-align: left; }
    .terminal-header { background: #0f172a; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
    .terminal-title { font-size: 11px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .terminal-controls { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.red { background: #ef4444; } .dot.yellow { background: #f59e0b; } .dot.green { background: #10b981; }
    
    .terminal-body { padding: 14px; height: 320px; overflow-y: auto; font-size: 11.5px; line-height: 1.6; color: #38bdf8; }
    .log-line { margin-bottom: 4px; word-break: break-all; }
    .log-time { color: #475569; }
    .log-tag-success { color: #4ade80; font-weight: bold; }
    .msg-box { border: 1px solid rgba(56, 189, 248, 0.2); background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 6px; margin: 8px 0; color: #e2e8f0; }
    
    .terminal-input-line { display: flex; align-items: center; background: #020617; padding: 8px 14px; border-top: 1px solid rgba(56, 189, 248, 0.2); }
    .terminal-prompt { color: #4ade80; font-size: 11.5px; margin-right: 8px; font-weight: bold; }
    .terminal-input { flex: 1; background: none; border: none; color: #f8fafc; font-family: 'Consolas', monospace; font-size: 11.5px; outline: none; }
    
    #kaki { width: 100%; color: #475569; text-align: center; padding: 15px; font-size: 11px; border-top: 1px solid rgba(56, 189, 248, 0.1); }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="login-container">
      <div class="login-header-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h2 style="font-size: 15px; margin-bottom: 8px; color: #fff;">ROOT AUTHENTICATION</h2>
      <div id="status-badge-box"></div>

      <div id="login-form-area">
        <div class="login-form-group">
          <label for="input-username">UID_IDENTIFIER</label>
          <input type="text" id="input-username" placeholder="Enter root user...">
        </div>
        <div class="login-form-group">
          <label for="input-password">SEC_PASSPHRASE</label>
          <div class="password-input-wrapper">
            <input type="password" id="input-password" placeholder="Enter security key...">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
          </div>
        </div>
        <button type="button" class="btn-submit-login" onclick="processAdminLogin()">EXECUTE LOGIN</button>
      </div>

      <div id="logged-in-area" style="display: none;">
        <p style="font-size: 11.5px; color: #94a3b8; margin-bottom: 14px; line-height: 1.5;">Root privileges granted. Full database terminal unlocked.</p>
        <button type="button" class="btn-submit-login" style="margin-bottom: 8px;" onclick="goToAdminPanel()">OPEN WEB CONSOLE</button>
        <button type="button" class="btn-logout" onclick="processAdminLogout()"><i class="fa-solid fa-power-off"></i> TERMINATE SESSION</button>
      </div>
      <a href="index.html" class="btn-back-home">&lt;&lt; Return to Public Root</a>
    </div>

    <div class="terminal-container" id="admin-terminal" style="display: none;">
      <div class="terminal-header">
        <div class="terminal-title"><i class="fa-solid fa-terminal" style="color: #38bdf8;"></i> root@mountain-core:~# (Secure Shell)</div>
        <div class="terminal-controls"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      </div>
      <div class="terminal-body" id="terminal-logs"></div>
      <div class="terminal-input-line">
        <span class="terminal-prompt">root@mountain-core:~#</span>
        <input type="text" class="terminal-input" id="terminal-cmd" placeholder="Type 'help' for command manual..." onkeydown="handleTerminalCommand(event)">
      </div>
    </div>
  </div>

  <footer id="kaki">&copy; 2026 Mountain Core Systems. Restricted Access Only.</footer>

  <script>
    const SUPABASE_URL = 'https://tobxthiynwepeylbblsv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_icluCCVkHxsP8K2RfjE_4A_tCTX0B-F';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cmdHistory = [];
    let historyIndex = -1;

    function checkAdminStatus() {
      const isAdmin = localStorage.getItem('is_admin') === 'true';
      const statusBadgeBox = document.getElementById('status-badge-box');
      const loginFormArea = document.getElementById('login-form-area');
      const loggedInArea = document.getElementById('logged-in-area');
      const adminTerminal = document.getElementById('admin-terminal');

      if (isAdmin) {
        statusBadgeBox.innerHTML = `<div class="status-badge active"><i class="fa-solid fa-circle-check"></i> STATUS: ROOT_ONLINE</div>`;
        loginFormArea.style.display = 'none';
        loggedInArea.style.display = 'block';
        adminTerminal.style.display = 'block';
        initTerminalLogs();
      } else {
        statusBadgeBox.innerHTML = `<div class="status-badge inactive"><i class="fa-solid fa-circle-xmark"></i> STATUS: UNAUTHORIZED</div>`;
        loginFormArea.style.display = 'block';
        loggedInArea.style.display = 'none';
        adminTerminal.style.display = 'none';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye';
      }
    }

    // Fungsi login yang mengecek langsung ke database Supabase tabel 'admins'
    async function processAdminLogin() {
      const user = document.getElementById('input-username').value.trim();
      const pass = document.getElementById('input-password').value.trim();

      if (!user || !pass) {
        alert('[SEC_WARN]: Username and password cannot be empty.');
        return;
      }

      try {
        // Query ke database tabel admins
        const { data, error } = await supabaseClient
          .from('admins')
          .select('*')
          .eq('username', user)
          .eq('password', pass)
          .single();

        if (error || !data) {
          alert('[SEC_WARN]: Access denied. Invalid credentials.');
        } else {
          localStorage.setItem('is_admin', 'true');
          alert('[SYSTEM_AUTH]: Root verification successful. Welcome, ' + data.username + '!');
          checkAdminStatus();
        }
      } catch (err) {
        console.error("Auth error:", err);
        alert('[ERR_SYS]: Authentication database connection failed.');
      }
    }

    function processAdminLogout() {
      if (confirm('Confirm session termination?')) {
        localStorage.setItem('is_admin', 'false');
        alert('[SYSTEM]: Session closed safely.');
        checkAdminStatus();
      }
    }

    function goToAdminPanel() { window.location.replace('index.html#contact'); }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function initTerminalLogs() {
      const logsContainer = document.getElementById('terminal-logs');
      logsContainer.innerHTML = `
        <div class="log-line"><span class="log-time">[00:00:01] [KERNEL]</span> Initializing Secure Shell v3.8...</div>
        <div class="log-line"><span class="log-time">[00:00:02] [NET_CORE]</span> Connecting to Supabase PostgreSQL... [OK]</div>
        <div class="log-line"><span class="log-tag-success">[SEC_OK]</span> Root user session authenticated [CipherNode].</div>
        <div class="log-line" style="color: #94a3b8; border-bottom: 1px dashed rgba(56,189,248,0.2); padding-bottom: 6px; margin-top: 6px;">Type 'help' to display command manual.</div>
      `;
      logsContainer.scrollTop = 0;
    }

    async function handleTerminalCommand(e) {
      const input = document.getElementById('terminal-cmd');
      const logsContainer = document.getElementById('terminal-logs');

      if (e.key === 'ArrowUp') {
        if (cmdHistory.length > 0 && historyIndex < cmdHistory.length - 1) {
          historyIndex++;
          input.value = cmdHistory[cmdHistory.length - 1 - historyIndex];
        }
        e.preventDefault();
        return;
      } else if (e.key === 'ArrowDown') {
        if (historyIndex > 0) {
          historyIndex--;
          input.value = cmdHistory[cmdHistory.length - 1 - historyIndex];
        } else if (historyIndex === 0) {
          historyIndex = -1;
          input.value = '';
        }
        e.preventDefault();
        return;
      }

      if (e.key === 'Enter') {
        const rawCmd = input.value.trim();
        if (!rawCmd) return;

        cmdHistory.push(rawCmd);
        historyIndex = -1;

        const cmdParts = rawCmd.split(' ');
        const mainCmd = cmdParts[0].toLowerCase();
        const param = cmdParts[1];

        let responseText = '';

        if (mainCmd === 'help' || mainCmd === 'info') {
          responseText = `
            <div style="color: #38bdf8; font-weight: bold; margin-bottom: 4px;">AVAILABLE SYSTEM COMMANDS:</div>
            <div>- <b>messages</b> (or <b>inbox</b>) : Fetch & parse ALL encrypted message records</div>
            <div>- <b>visitors</b> (or <b>logs</b>)   : Query visitor telemetry & client fingerprint</div>
            <div>- <b>delmsg &lt;id&gt;</b>           : Purge specific message record by ID</div>
            <div>- <b>sysinfo</b>               : Print kernel runtime environment</div>
            <div>- <b>status</b>                : Perform real-time cluster health check</div>
            <div>- <b>ping</b>                  : Measure socket round-trip latency</div>
            <div>- <b>matrix</b>                : Dump binary memory stream buffer</div>
            <div>- <b>history</b>               : Output command execution history</div>
            <div>- <b>clear</b>                 : Clear terminal output screen</div>
            <div>- <b>logout</b>                : Terminate active root session</div>
          `;
        } else if (mainCmd === 'messages' || mainCmd === 'inbox') {
          logsContainer.innerHTML += `<div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">root@mountain-core:~#</span> ${rawCmd}</div>`;
          logsContainer.innerHTML += `<div class="log-line" style="color: #facc15;">[EXEC] Querying PostgreSQL 'messages'...</div>`;
          
          const { data: messages, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) {
            responseText = `<span style="color: #ef4444;">[ERR_DB]: ${escapeHtml(error.message)}</span>`;
          } else if (!messages || messages.length === 0) {
            responseText = `<div class="log-line" style="color: #94a3b8;">[INFO] Table 'messages' is empty.</div>`;
          } else {
            responseText = `<div style="color: #4ade80; font-weight: bold; margin-bottom: 6px;">--- ALL SECURE MESSAGES (${messages.length}) ---</div>`;
            messages.forEach((msg) => {
              const dateFormatted = new Date(msg.created_at).toLocaleString('id-ID');
              responseText += `
                <div class="msg-box">
                  <div><span style="color: #facc15; font-weight: bold;">ID: #${escapeHtml(String(msg.id))}</span> | <span style="color: #94a3b8;">${dateFormatted}</span></div>
                  <div style="margin-top: 4px;"><b>Sender:</b> ${escapeHtml(msg.nama)} (<span style="color: #38bdf8;">${escapeHtml(msg.email)}</span>)</div>
                  <div style="margin-top: 6px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 4px; color: #f8fafc;"><b>Payload:</b> "${escapeHtml(msg.pesan)}"</div>
                </div>
              `;
            });
          }
        } else if (mainCmd === 'visitors' || mainCmd === 'logs') {
          logsContainer.innerHTML += `<div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">root@mountain-core:~#</span> ${rawCmd}</div>`;
          logsContainer.innerHTML += `<div class="log-line" style="color: #facc15;">[EXEC] Extracting client telemetry...</div>`;
          
          const { data: visitors, error } = await supabaseClient
            .from('visitors')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (error) {
            responseText = `<span style="color: #ef4444;">[ERR_DB]: ${escapeHtml(error.message)}</span>`;
          } else if (!visitors || visitors.length === 0) {
            responseText = `<div class="log-line" style="color: #94a3b8;">[INFO] No visitor logs recorded.</div>`;
          } else {
            responseText = `<div style="color: #4ade80; font-weight: bold; margin-bottom: 6px;">--- VISITOR TELEMETRY (${visitors.length}) ---</div>`;
            visitors.forEach((v) => {
              const dateFormatted = new Date(v.created_at).toLocaleString('id-ID');
              responseText += `
                <div class="msg-box">
                  <div><span style="color: #facc15;">TIME: ${dateFormatted}</span> | <span style="color: #38bdf8;">IP: ${escapeHtml(v.ip_address || 'N/A')}</span></div>
                  <div style="margin-top: 4px; color: #e2e8f0;"><b>Fingerprint:</b> ${escapeHtml(v.device_info)}</div>
                </div>
              `;
            });
          }
        } else if (mainCmd === 'delmsg') {
          if (!param) {
            responseText = `<span style="color: #ef4444;">[SYNTAX_ERR] Usage: <b>delmsg &lt;id&gt;</b></span>`;
          } else {
            logsContainer.innerHTML += `<div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">root@mountain-core:~#</span> ${rawCmd}</div>`;
            logsContainer.innerHTML += `<div class="log-line" style="color: #facc15;">[EXEC] Purging record ID #${escapeHtml(param)}...</div>`;

            const { error } = await supabaseClient
              .from('messages')
              .delete()
              .eq('id', param);

            if (error) {
              responseText = `<span style="color: #ef4444;">[ERR_PURGE]: ${escapeHtml(error.message)}</span>`;
            } else {
              responseText = `<span class="log-tag-success">[SUCCESS]</span> Record ID <b>#${escapeHtml(param)}</b> permanently wiped.`;
            }
          }
        } else if (mainCmd === 'sysinfo') {
          responseText = `
            <div><b>SYSTEM KERNEL SPECIFICATION:</b></div>
            <div>- OS Kernel: Mountain-SecureOS v3.8-Hardened</div>
            <div>- Edge Network: Vercel Serverless Proxy</div>
            <div>- Database: Supabase PostgreSQL Cloud</div>
            <div>- Active Session: CipherNode [ROOT]</div>
          `;
        } else if (mainCmd === 'status') {
          responseText = `<span class="log-tag-success">[STATUS_OK]</span> Database cluster connection is stable.`;
        } else if (mainCmd === 'ping') {
          const latency = Math.floor(Math.random() * 20) + 10;
          responseText = `<span class="log-tag-success">[PONG]</span> Latency to Edge node: <b>${latency} ms</b>`;
        } else if (mainCmd === 'matrix') {
          responseText = `<span style="color: #22c55e;">01010011 01111001 01110011 01110100 01100101 01100101 01101101 00100000 01010011 01100101 01100111 01110101 01110010 01100101 00101100 00100000 01001111 01001011</span>`;
        } else if (mainCmd === 'history') {
          responseText = `<div><b>COMMAND HISTORY:</b></div>`;
          cmdHistory.forEach((c, idx) => {
            responseText += `<div>[${idx + 1}] ${escapeHtml(c)}</div>`;
          });
        } else if (mainCmd === 'clear') {
          logsContainer.innerHTML = '';
          input.value = '';
          return;
        } else if (mainCmd === 'logout') {
          processAdminLogout();
          input.value = '';
          return;
        } else {
          responseText = `<span style="color: #ef4444;">[ERR_CMD]: '${escapeHtml(rawCmd)}' not found. Type 'help'.</span>`;
        }

        if (mainCmd !== 'messages' && mainCmd !== 'inbox' && mainCmd !== 'visitors' && mainCmd !== 'logs' && mainCmd !== 'delmsg') {
          logsContainer.innerHTML += `
            <div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">root@mountain-core:~#</span> ${escapeHtml(rawCmd)}</div>
          `;
        }
        
        logsContainer.innerHTML += `<div class="log-line">${responseText}</div>`;
        input.value = '';
        logsContainer.scrollTop = logsContainer.scrollHeight;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      checkAdminStatus();
      
      try {
        let ipAddress = 'UNKNOWN_IP';
        try {
          const ipRes = await fetch('https://ipapi.co/json/');
          const ipData = await ipRes.json();
          if (ipData && ipData.ip) {
            ipAddress = `${ipData.ip} (${ipData.city || 'Unknown'}, ${ipData.country_name || 'Unknown'})`;
          }
        } catch (e) {}

        const ua = navigator.userAgent;
        let deviceType = "Desktop Workstation";
        if (/android/i.test(ua)) deviceType = "Mobile Android Device";
        else if (/iphone|ipad|ipod/i.test(ua)) deviceType = "Apple iOS Device";

        let browserName = "Unknown Browser";
        if (ua.indexOf("Firefox") > -1) browserName = "Mozilla Firefox";
        else if (ua.indexOf("Edge") > -1) browserName = "Microsoft Edge";
        else if (ua.indexOf("Chrome") > -1) browserName = "Google Chrome";
        else if (ua.indexOf("Safari") > -1) browserName, ua = "Apple Safari";

        const finalFingerprint = `${deviceType} // ${browserName}`;

        await supabaseClient.from('visitors').insert([
          { device_info: finalFingerprint, ip_address: ipAddress }
        ]);
      } catch (err) {}
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Mountain Indonesia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { 
      padding: 0; 
      margin: 0; 
      box-sizing: border-box; 
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
    }

    html, body {
      width: 100%;
      height: 100vh;
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      width: 100%;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-right, .nav-left { 
      display: flex; 
      gap: 15px; 
    }

    .nav-left a, .nav-right a { 
      font-size: 13px; 
      text-decoration: none; 
      color: #a3a3a3; 
      font-family: cursive; 
      font-weight: 600; 
      transition: color 0.3s ease; 
    }

    .nav-left a:hover, .nav-right a:hover { 
      color: #ffffff; 
    }

    #text-logo { 
      color: #fff; 
      font-size: 16px; 
      letter-spacing: 3px; 
      text-align: center; 
      font-family: cursive; 
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      margin: auto;
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .login-header-icon {
      font-size: 28px;
      color: #fff;
      margin-bottom: 10px;
    }

    .login-form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .login-form-group label {
      display: block;
      font-size: 11.5px;
      color: #d1d5db;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .password-input-wrapper {
      position: relative;
    }

    .login-form-group input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-form-group input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle-password-btn:hover {
      color: #fff;
    }

    .btn-submit-login {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #111;
      border: none;
      font-weight: bold;
      font-size: 12.5px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-submit-login:hover {
      background: #e5e5e5;
    }

    .btn-back-home {
      display: inline-block;
      color: #9ca3af;
      font-size: 11.5px;
      text-decoration: none;
      margin-top: 14px;
      transition: color 0.2s;
    }

    .btn-back-home:hover {
      color: #fff;
    }

    #kaki { 
      width: 100%;
      color: #737373; 
      text-align: center; 
      background-color: #0d0d0d; 
      padding: 20px; 
      font-size: 12px; 
      border-top: 1px solid rgba(255,255,255,0.05); 
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </div>
    <div class="logo">
      <h1 id="text-logo">Mountain</h1>
    </div>
    <div class="nav-right">
      <a href="service.html">Service</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-header-icon"><i class="fa-solid fa-fingerprint"></i></div>
    <h2 style="font-size: 16px; margin-bottom: 4px; color: #fff;">Autentikasi Admin</h2>
    <p style="font-size: 11.5px; color: #9ca3af; margin-bottom: 20px;">Masukkan kredensial terenkripsi untuk masuk ke panel kontrol.</p>
    
    <div class="login-form-group">
      <label for="input-username">Username</label>
      <input type="text" id="input-username" placeholder="Masukkan username...">
    </div>

    <div class="login-form-group">
      <label for="input-password">Password</label>
      <div class="password-input-wrapper">
        <input type="password" id="input-password" placeholder="Masukkan password...">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
      </div>
    </div>

    <button type="button" class="btn-submit-login" onclick="processAdminLogin()">Verifikasi</button>
    <a href="index.html" class="btn-back-home">Kembali ke Beranda</a>
  </div>

  <footer id="kaki">&copy; 2026 Mountain. All rights reserved.</footer>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function processAdminLogin() {
      const user = document.getElementById('input-username').value.trim();
      const pass = document.getElementById('input-password').value.trim();

      const correctUser = 'rifderprimo';
      const correctPass = 'blackcipher';

      if (user === correctUser && pass === correctPass) {
        localStorage.setItem('is_admin', 'true');
        alert('Autentikasi Berhasil! Mengarahkan ke panel komentar...');
        window.location.replace('index.html#contact');
      } else {
        alert('Username atau Password salah!');
      }
    }
  </script>
</body>
</html>

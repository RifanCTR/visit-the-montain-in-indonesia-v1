<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Secure Core Terminal - Mountain OS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', monospace; }
    html, body { width: 100%; min-height: 100vh; background-color: #030712; color: #f8fafc; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 0; }
    .main-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 16px; }
    .login-container { width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(56, 189, 248, 0.3); padding: 28px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); text-align: center; }
    .login-header-icon { font-size: 32px; color: #38bdf8; margin-bottom: 12px; }
    h1 { font-size: 15px; margin-bottom: 8px; color: #fff; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 11.5px; font-weight: bold; margin-bottom: 16px; }
    .status-badge.active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-badge.inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .login-form-group { margin-bottom: 16px; text-align: left; }
    .login-form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: bold; }
    .password-input-wrapper { position: relative; }
    .login-form-group input { width: 100%; padding: 11px 14px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; color: #fff; font-size: 12.5px; outline: none; font-family: 'Consolas', monospace; }
    .toggle-password-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 14px; }
    .btn-submit-login { width: 100%; padding: 12px; background: #38bdf8; color: #030712; border: none; font-weight: bold; font-size: 12.5px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-family: 'Consolas', monospace; }
    .btn-submit-login:hover { background: #0ea5e9; }
    .btn-logout { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); font-weight: bold; font-size: 12.5px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-family: 'Consolas', monospace; }
    .sub-desc { font-size: 11.5px; color: #94a3b8; margin-bottom: 14px; line-height: 1.5; }
    .btn-back-home { display: inline-block; color: #64748b; font-size: 11px; text-decoration: none; margin-top: 16px; }
    .terminal-container { width: 90%; max-width: 750px; margin: 20px auto 0 auto; background: #030712; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); overflow: hidden; text-align: left; }
    .terminal-header { background: #0f172a; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(56, 189, 248, 0.2); }
    .terminal-title { font-size: 11px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .terminal-controls { display: flex; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.red { background: #ef4444; } .dot.yellow { background: #f59e0b; } .dot.green { background: #10b981; }
    .terminal-body { padding: 14px; height: 340px; overflow-y: auto; font-size: 11.5px; line-height: 1.6; color: #38bdf8; }
    .log-line { margin-bottom: 4px; word-break: break-all; }
    .log-tag-success { color: #4ade80; font-weight: bold; }
    .msg-box { border: 1px solid rgba(56, 189, 248, 0.2); background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 6px; margin: 8px 0; color: #e2e8f0; }
    .terminal-input-line { display: flex; align-items: center; background: #020617; padding: 8px 14px; border-top: 1px solid rgba(56, 189, 248, 0.2); }
    .terminal-prompt { color: #4ade80; font-size: 11.5px; margin-right: 8px; font-weight: bold; }
    .terminal-input { flex: 1; background: none; border: none; color: #f8fafc; font-family: 'Consolas', monospace; font-size: 11.5px; outline: none; }
    #kaki { width: 100%; color: #475569; text-align: center; padding: 15px; font-size: 11px; border-top: 1px solid rgba(56, 189, 248, 0.1); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <main class="main-wrapper">
    <section class="login-container">
      <div class="login-header-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>ROOT AUTHENTICATION</h1>
      <div id="status-badge-box" class="status-badge inactive"><i class="fa-solid fa-circle-xmark"></i> STATUS: UNAUTHORIZED</div>

      <form id="login-form">
        <div class="login-form-group">
          <label for="input-username">UID_IDENTIFIER</label>
          <input type="text" id="input-username" autocomplete="username" required maxlength="64" placeholder="Enter root user...">
        </div>
        <div class="login-form-group">
          <label for="input-password">SEC_PASSPHRASE</label>
          <div class="password-input-wrapper">
            <input type="password" id="input-password" autocomplete="current-password" required maxlength="1024" placeholder="Enter security key...">
            <button type="button" class="toggle-password-btn" id="toggle-password"><i class="fa-solid fa-eye" id="eye-icon"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-submit-login" id="login-button">EXECUTE LOGIN</button>
      </form>

      <div id="logged-in-area" hidden>
        <p class="sub-desc">Root privileges granted via secure API. Terminal unlocked.</p>
        <button type="button" class="btn-submit-login" style="margin-bottom: 8px;" onclick="goToAdminPanel()">OPEN WEB CONSOLE</button>
        <button type="button" class="btn-logout" id="logout-btn"><i class="fa-solid fa-power-off"></i> TERMINATE SESSION</button>
      </div>

      <a href="index.html" class="btn-back-home">&lt;&lt; Return to Public Root</a>
    </section>

    <section class="terminal-container" id="admin-terminal" hidden>
      <div class="terminal-header">
        <div class="terminal-title"><i class="fa-solid fa-terminal" style="color: #38bdf8;"></i> root@mountain-core:~# (Secure API Shell)</div>
        <div class="terminal-controls"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      </div>
      <div class="terminal-body" id="terminal-logs"></div>
      <form class="terminal-input-line" id="command-form">
        <span class="terminal-prompt">root@mountain-core:~#</span>
        <input type="text" class="terminal-input" id="terminal-cmd" autocomplete="off" spellcheck="false" placeholder="Type 'help' for command manual..." maxlength="300">
      </form>
    </section>
  </main>

  <footer id="kaki">&copy; 2026 Mountain Core Systems. Restricted Access Only.</footer>

  <script>
    (() => {
      'use strict';
      const SUPABASE_URL = 'https://tobxthiynwepeylbblsv.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_icluCCVkHxsP8K2RfjE_4A_tCTX0B-F';
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      let cmdHistory = [];
      let isExecuting = false;

      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const delay = ms => new Promise(res => setTimeout(res, ms));

      const log = (html) => { 
        const el = document.createElement('div'); 
        el.className = 'log-line'; 
        el.innerHTML = html; 
        document.getElementById('terminal-logs').appendChild(el); 
        document.getElementById('terminal-logs').scrollTop = document.getElementById('terminal-logs').scrollHeight; 
        return el;
      };

      async function streamGitLogs(steps, speed = 180) {
        for (let step of steps) {
          log(step);
          await delay(speed);
        }
      }

      function refreshUI() {
        const isAuth = localStorage.getItem('is_admin') === 'true';
        document.getElementById('login-form').hidden = isAuth;
        document.getElementById('logged-in-area').hidden = !isAuth;
        document.getElementById('admin-terminal').hidden = true;
        
        const badge = document.getElementById('status-badge-box');
        if (isAuth) {
          badge.className = 'status-badge active';
          badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> STATUS: ROOT_ONLINE`;
        } else {
          badge.className = 'status-badge inactive';
          badge.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> STATUS: UNAUTHORIZED`;
        }
      }

      async function callAdminAPI(action, body = {}) {
        const response = await fetch('/api/admin/' + encodeURIComponent(action), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const payload = await response.json().catch(() => ({ error: 'Invalid server response' }));
        if (!response.ok) throw new Error(payload.error || 'Request failed');
        return payload;
      }

      document.getElementById('toggle-password').addEventListener('click', () => {
        const p = document.getElementById('input-password');
        const eye = document.getElementById('eye-icon');
        const show = p.type === 'password';
        p.type = show ? 'text' : 'password';
        eye.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-button');
        btn.disabled = true;

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('input-username').value.trim(),
              password: document.getElementById('input-password').value
            })
          });

          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.success) throw new Error(result.error || 'Invalid credentials');

          localStorage.setItem('is_admin', 'true');
          refreshUI();
          document.getElementById('input-password').value = '';
          alert('[SYSTEM_AUTH]: Root verification successful. Welcome, ' + result.username + '!');
        } catch (err) {
          localStorage.setItem('is_admin', 'false');
          alert('[SEC_WARN]: Access denied. ' + err.message);
          refreshUI();
        } finally {
          btn.disabled = false;
        }
      });

      window.goToAdminPanel = async () => {
        try {
          await callAdminAPI('check');
          document.getElementById('admin-terminal').hidden = false;
          document.getElementById('terminal-logs').innerHTML = '';
          
          log('<span style="color: #94a3b8;">PS C:\\Users\\mountain\\project> git push origin main</span>');
          await streamGitLogs([
            'Enumerating objects: 12, done.',
            'Counting objects: 100% (12/12), done.',
            'Delta compression using up to 8 threads',
            'Compressing objects: 100% (6/6), done.',
            'Writing objects: 100% (6/6), 1.24 KiB | 1.24 MiB/s, done.',
            'Total 6 (delta 3), reused 0 (delta 0), pack-reused 0',
            'remote: Resolving deltas: 100% (3/3), completed.',
            '<span class="log-tag-success">To https://github.com/RifanCTR/visit-the-montain-in-indonesia-v1.git</span>',
            '<span style="color: #facc15;">   fc81032..0414589  main -> main</span>',
            '<span class="log-tag-success">[SEC_OK] Secure Shell connected & session token verified successfully.</span>'
          ], 150);

          log('<div class="log-line" style="color: #94a3b8; border-bottom: 1px dashed rgba(56,189,248,0.2); padding-bottom: 6px; margin-top: 6px;">Type <b>\'help\'</b> to display command manual.</div>');
          document.getElementById('admin-terminal').scrollIntoView({ behavior: 'smooth' });
          document.getElementById('terminal-cmd').focus();
        } catch (err) {
          alert('[DENIED]: ' + err.message);
        }
      };

      document.getElementById('logout-btn').addEventListener('click', () => {
        if (confirm('Confirm session termination?')) {
          localStorage.setItem('is_admin', 'false');
          document.getElementById('admin-terminal').hidden = true;
          document.getElementById('terminal-logs').innerHTML = '';
          refreshUI();
          alert('[SYSTEM]: Session closed safely.');
        }
      });

      document.getElementById('command-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isExecuting) return;

        const input = document.getElementById('terminal-cmd');
        const raw = input.value.trim();
        input.value = '';
        if (!raw) return;

        isExecuting = true;
        cmdHistory.push(raw);

        log('<div class="log-line" style="margin-top: 8px;"><span class="terminal-prompt">root@mountain-core:~#</span> ' + esc(raw) + '</div>');

        const parts = raw.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const arg = parts[1];

        try {
          if (cmd === 'help' || cmd === 'info') {
            await streamGitLogs(['[FETCHING COMMAND MANIFEST...]'], 100);
            log(`
              <div style="color: #38bdf8; font-weight: bold; margin-bottom: 4px;">AVAILABLE SYSTEM COMMANDS:</div>
              <div>- <b>messages</b> (or <b>inbox</b>) : Fetch encrypted message records securely via API</div>
              <div>- <b>visitors</b> (or <b>logs</b>)   : Query visitor telemetry stream</div>
              <div>- <b>delmsg &lt;id&gt;</b>           : Purge specific message record by ID</div>
              <div>- <b>sysinfo</b>               : Print kernel runtime environment</div>
              <div>- <b>status</b>                : Perform real-time cluster health check</div>
              <div>- <b>ping</b>                  : Measure socket round-trip latency</div>
              <div>- <b>matrix</b>                : Dump binary memory stream buffer</div>
              <div>- <b>history</b>               : Output command execution history</div>
              <div>- <b>clear</b>                 : Clear terminal output screen</div>
              <div>- <b>logout</b>                : Terminate active root session</div>
            `);
          } else if (cmd === 'clear') {
            document.getElementById('terminal-logs').innerHTML = '';
          } else if (cmd === 'logout') {
            document.getElementById('logout-btn').click();
          } else if (cmd === 'status') {
            await streamGitLogs(['[CHECKING CLUSTER HEALTH...]'], 120);
            await callAdminAPI('check');
            log('<span class="log-tag-success">[STATUS_OK]</span> Server-side authorization verified successfully.');
          } else if (cmd === 'sysinfo') {
            await streamGitLogs(['[GATHERING SYSTEM SPECS...]'], 120);
            log(`
              <div><b>SYSTEM KERNEL SPECIFICATION:</b></div>
              <div>- OS Kernel: Mountain-SecureOS v3.8-Hardened</div>
              <div>- Edge Network: Vercel Serverless Function Proxy</div>
              <div>- Database: Supabase PostgreSQL Cloud Cluster</div>
            `);
          } else if (cmd === 'ping') {
            await streamGitLogs(['[PINGING EDGE NODE...]'], 100);
            const latency = Math.floor(Math.random() * 15) + 8;
            log('<span class="log-tag-success">[PONG]</span> Round-trip latency to Edge node: <b>' + latency + ' ms</b>');
          } else if (cmd === 'matrix') {
            await streamGitLogs(['[DUMPING MEMORY BUFFER...]'], 100);
            log('<span style="color: #22c55e;">01010011 01111001 01110011 01110100 01100101 01100101 01101101 00100000 01010011 01100101 01100011 01110101 01110010 01100101 00101100 00100000 01001111 01001011</span>');
          } else if (cmd === 'history') {
            let histHtml = '<div><b>COMMAND HISTORY:</b></div>';
            cmdHistory.forEach((c, idx) => { histHtml += `<div>[${idx + 1}] ${esc(c)}</div>`; });
            log(histHtml);
          } else if (cmd === 'messages' || cmd === 'inbox') {
            await streamGitLogs([
              'Enumerating messages: 100%, done.',
              'Compressing payload buffers...',
              'Writing objects to stream: done.'
            ], 150);

            const res = await callAdminAPI('messages');
            if (!res.data || res.data.length === 0) {
              log('<span style="color: #94a3b8;">[INFO] Database table "messages" is empty.</span>');
            } else {
              let msgHtml = `<div style="color: #4ade80; font-weight: bold; margin-bottom: 6px;">--- ALL SECURE MESSAGES (${res.data.length}) ---</div>`;
              res.data.forEach(m => {
                const dateFormatted = new Date(m.created_at).toLocaleString('id-ID');
                msgHtml += `
                  <div class="msg-box">
                    <div><span style="color: #facc15; font-weight: bold;">ID: #${esc(m.id)}</span> | <span style="color: #94a3b8;">${esc(dateFormatted)}</span></div>
                    <div style="margin-top: 4px;"><b>Sender:</b> ${esc(m.nama)} (<span style="color: #38bdf8;">${esc(m.email)}</span>)</div>
                    <div style="margin-top: 6px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 4px; color: #f8fafc;"><b>Payload:</b> "${esc(m.pesan)}"</div>
                  </div>
                `;
              });
              log(msgHtml);
            }
          } else if (cmd === 'visitors' || cmd === 'logs') {
            await streamGitLogs([
              'Counting visitor records: 100%, done.',
              'Fetching telemetry stream...'
            ], 150);

            const res = await callAdminAPI('visitors');
            if (!res.data || res.data.length === 0) {
              log('<span style="color: #94a3b8;">[INFO] No visitor telemetry recorded.</span>');
            } else {
              let visHtml = `<div style="color: #4ade80; font-weight: bold; margin-bottom: 6px;">--- VISITOR TELEMETRY (${res.data.length}) ---</div>`;
              res.data.forEach(v => {
                const dateFormatted = new Date(v.created_at).toLocaleString('id-ID');
                visHtml += `
                  <div class="msg-box">
                    <div><span style="color: #facc15;">TIME: ${esc(dateFormatted)}</span> | <span style="color: #38bdf8;">IP: ${esc(v.ip_address || 'N/A')}</span></div>
                    <div style="margin-top: 4px; color: #e2e8f0;"><b>Fingerprint:</b> ${esc(v.device_info)}</div>
                  </div>
                `;
              });
              log(visHtml);
            }
          } else if (cmd === 'delmsg') {
            if (!arg) throw new Error('Usage: delmsg <id>');
            if (!confirm('Purge record ID #' + arg + ' from database?')) return;
            
            await streamGitLogs(['[PURGING DATABASE RECORD...]'], 120);
            await callAdminAPI('delmsg', { id: arg });
            log('<span class="log-tag-success">[SUCCESS]</span> Record ID <b>#' + esc(arg) + '</b> permanently wiped.');
          } else {
            log('<span style="color: #ef4444;">[ERR_CMD]: \'' + esc(raw) + '\' not found. Type "help".</span>');
          }
        } catch (err) {
          log('<span style="color: #ef4444;">[ERROR] ' + esc(err.message) + '</span>');
        } finally {
          isExecuting = false;
          document.getElementById('terminal-cmd').focus();
        }
      });

      refreshUI();
    })();
  </script>
</body>
</html>
